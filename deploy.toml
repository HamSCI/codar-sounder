[package]
name             = "codar-sounder"
version          = "0.7.0"
contract_version = "0.8"
license          = "MIT"

# Identity + sigmond-side policy (Wave 2 [client] block).
[client]
name        = "codar-sounder"
kind        = "client"
description = "Opportunistic ionospheric sounder using CODAR chirp transmissions"
repo        = "https://github.com/HamSCI/codar-sounder"
requires    = ["ka9q-python", "ka9q-radio"]
contract    = "0.8"

# Lifecycle ordering. Starts after radiod (priority 0) but in parallel with
# the decoder chain — codar-sounder doesn't feed any other client.
[client.lifecycle]
start_priority = 200

# Generic extras passthrough — values from coordination.toml [[clients.X]]
# that should appear in coordination.env.
[client.coordination]
passthrough_extras = [
    "tx_lat_deg", "tx_lon_deg",
    "sweep_rate_hz_per_s", "sweep_bw_hz", "sweep_repetition_hz",
]

# Configuration interview (CONTRACT v0.5 §14).  Sigmond invokes
# codar-sounder's own argparse subcommands.  Both honor §14.3 env-var bag
# (STATION_*, SIGMOND_INSTANCE, SIGMOND_RADIOD_STATUS) as defaults.
[contract.config]
init = ["/usr/local/bin/codar-sounder", "config", "init"]
edit = ["/usr/local/bin/codar-sounder", "config", "edit"]

[build]
steps = [
    "python3 -m venv /opt/git/sigmond/codar-sounder/venv",
    "/opt/git/sigmond/codar-sounder/venv/bin/pip install --upgrade pip setuptools wheel",
    "/opt/git/sigmond/codar-sounder/venv/bin/pip install -e /opt/git/sigmond/codar-sounder",
]
produces = [
    "/opt/git/sigmond/codar-sounder/venv/bin/codar-sounder",
]

[[install.steps]]
kind = "link"
src  = "/opt/git/sigmond/codar-sounder/venv/bin/codar-sounder"
dst  = "/usr/local/bin/codar-sounder"

[[install.steps]]
kind = "link"
src  = "systemd/codar-sounder@.service"
dst  = "/etc/systemd/system/codar-sounder@.service"

[[install.steps]]
kind      = "render"
src       = "config/codar-sounder-config.toml.template"
dst       = "/etc/codar-sounder/codar-sounder-config.toml"
if_absent = true

[[install.steps]]
kind  = "mkdir"
dst   = "/var/lib/codar-sounder"
owner = "codarsnd:codarsnd"
mode  = "0755"

[[install.steps]]
kind  = "mkdir"
dst   = "/var/log/codar-sounder"
owner = "codarsnd:codarsnd"
mode  = "0755"

[systemd]
templated_units = ["codar-sounder@.service"]
# One instance per radiod named in codar-sounder-config.toml's [[radiod]] blocks
# (placeholder skipped): sigmond starts codar-sounder@<radiod> for each.
instances_from = "config-radiods"

# CONTRACT v0.6 §17 — the daemon writes one row per detected peak per
# CPI to the local HamSCI sink (SQLite store-and-forward queue under
# sigmond's state dir) in parallel with the canonical JSONL spool,
# when that sink is in play.  Hosts without it stay file-only with no
# extra moving parts; JSONL remains the canonical L1 artefact
# (Kaeppler-compatible Zenodo schema).

# Wave 3 §15 channel contribution: declare the wide IQ channel(s) sigmond
# should provision in radiod for codar-sounder.  Rendered into
# /etc/radio/radiod@<id>.conf.d/40-codar-sounder.conf during smd apply.
[[radiod.fragment]]
priority = 40
target   = "*"
template = "etc/radiod-fragment.conf"

[deps]
[[deps.pypi]]
name    = "ka9q-python"
# ≥3.14 to match pyproject: 3.11 added the low_edge/high_edge filter kwargs to
# ensure_channel (so RadiodIQSource captures the full CODAR chirp bandwidth, not
# the iq preset's ±5 kHz audio filter), and 3.14 added RadiodControl(client_id=).
version = ">=3.14.0"
venv    = "/opt/git/sigmond/codar-sounder/venv"

[[deps.pypi]]
name    = "numpy"
version = ">=1.24.0"
venv    = "/opt/git/sigmond/codar-sounder/venv"

# ---------------------------------------------------------------------------
# sigmondb rows -> wd30 (tasks/chirp-registry/2026-11-12-codar-sigmondb-design.md).
# The same tables and tar tags as hfdl-recorder's: sigmondb's ingest never asks
# which program wrote a row, so chirp-recorder declares these same two later.
# sigmond renders them only for an hs-uploader that offers "sigmondb-tar".
# ---------------------------------------------------------------------------

[[hs_uploader.pipeline]]
name = "codar-sigmondb-arrival"
requires_features = ["sigmondb-tar"]
batch_limit = 5000
[hs_uploader.pipeline.source]
type = "sqlite"
database = "sigmondb"
table = "arrival"
accepted_schema_versions = [1]
producer = "codar-sounder"          # no start_at: the rows are new; ship from the first
[hs_uploader.pipeline.transport]
type = "wsprdaemon_tar"
name = "wsprdaemon-tar-sftp:codar-sigmondb-arrival"
servers = ["gw1.wsprdaemon.org", "gw2.wsprdaemon.org"]
version = "4.0"
receiver = "{call_pathsafe}"
compression = "bz2"
tar_root = "wsprdaemon"
primary_table_name = "sigmondb.arrival"
tar_tag = "chirp-arrival"
[hs_uploader.pipeline.transport.ftp_fallback]
servers = ["gw2.wsprdaemon.org"]
ftp_user = "noisegraphs"
remote_path = "upload"
[hs_uploader.pipeline.retry]
base = 2.0
cap_sec = 900.0

[[hs_uploader.pipeline]]
name = "codar-sigmondb-capture"
requires_features = ["sigmondb-tar"]
batch_limit = 5000
[hs_uploader.pipeline.source]
type = "sqlite"
database = "sigmondb"
table = "capture"
accepted_schema_versions = [1]
producer = "codar-sounder"
[hs_uploader.pipeline.transport]
type = "wsprdaemon_tar"
name = "wsprdaemon-tar-sftp:codar-sigmondb-capture"
servers = ["gw1.wsprdaemon.org", "gw2.wsprdaemon.org"]
version = "4.0"
receiver = "{call_pathsafe}"
compression = "bz2"
tar_root = "wsprdaemon"
primary_table_name = "sigmondb.capture"
tar_tag = "chirp-capture"
[hs_uploader.pipeline.transport.ftp_fallback]
servers = ["gw2.wsprdaemon.org"]
ftp_user = "noisegraphs"
remote_path = "upload"
[hs_uploader.pipeline.retry]
base = 2.0
cap_sec = 900.0

# ---------------------------------------------------------------------------
# Sigmond UI hooks (drop-in registration for `smd watch` + TUI Activity).
# Consumed by lib/sigmond/client_features.py.
# ---------------------------------------------------------------------------

[client_features.watch]
verb         = "codar"
description  = "CODAR per-station soundings + SNR rollup"
verbose      = true
per_instance = true

[client_features.receiver_channels]
description  = "CODAR per-station IQ channels (one per [[transmitter]])"
per_instance = true
parser_file  = "src/codar_sounder/sigmond_tui.py"
parser_attr  = "parse_receiver_channels"
